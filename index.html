<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Тестирование по дисциплинам</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #182230;
      --muted: #667085;
      --border: #d0d5dd;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --ok-bg: #ecfdf3;
      --ok-border: #12b76a;
      --ok-text: #027a48;
      --bad-bg: #fef3f2;
      --bad-border: #f04438;
      --bad-text: #b42318;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .container {
      max-width: 820px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }
    .card {
      background: var(--card);
      border: 1px solid #e4e7ec;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(16, 24, 40, 0.05);
      margin-bottom: 18px;
    }
    h1 { margin: 0 0 8px; font-size: 24px; }
    h2 { margin: 0 0 14px; font-size: 20px; }
    p.sub { margin: 0 0 20px; color: var(--muted); font-size: 15px; }
    .subject-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }
    .subj-btn {
      padding: 16px;
      border: 2px solid #e4e7ec;
      border-radius: 12px;
      background: #fff;
      cursor: pointer;
      text-align: left;
      transition: 0.15s ease;
    }
    .subj-btn:hover {
      border-color: var(--accent);
      background: #eff6ff;
    }
    .subj-title { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
    .subj-count { font-size: 13px; color: var(--muted); }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
      font-size: 14px;
      color: var(--muted);
    }
    .progress-wrap {
      width: 100%;
      height: 8px;
      background: #e4e7ec;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 18px;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.25s ease;
    }
    .q-meta {
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 8px;
    }
    .q-text {
      font-size: 17px;
      font-weight: 600;
      line-height: 1.5;
      white-space: pre-line;
      margin-bottom: 14px;
    }
    .q-images {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }
    .q-images img {
      max-width: 100%;
      max-height: 320px;
      border-radius: 8px;
      border: 1px solid #e4e7ec;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .opt-label {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      transition: 0.15s ease;
      line-height: 1.45;
      white-space: pre-line;
    }
    .opt-label:hover {
      border-color: var(--accent);
      background: #f8fafc;
    }
    .opt-label.selected {
      border-color: var(--accent);
      background: #eff6ff;
    }
    .opt-label input {
      margin-top: 3px;
      accent-color: var(--accent);
    }
    .opt-label img {
      display: block;
      max-width: 260px;
      max-height: 180px;
      margin-top: 6px;
      border-radius: 6px;
    }
    .nav-btns {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 20px;
    }
    .btn {
      padding: 11px 18px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { background: #f8fafc; }
    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .result-box {
      text-align: center;
      padding: 12px 0 8px;
    }
    .score-big {
      font-size: 40px;
      font-weight: 800;
      color: var(--accent);
      margin: 8px 0;
    }
    .score-sub {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 18px;
    }
    .review-item {
      border-top: 1px solid #e4e7ec;
      padding-top: 16px;
      margin-top: 16px;
    }
    .ans-bad {
      background: var(--bad-bg);
      border: 1px solid var(--bad-border);
      color: var(--bad-text);
      padding: 8px 12px;
      border-radius: 8px;
      margin-top: 6px;
      font-weight: 600;
    }
    .review-opts {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
    }
    .review-opt {
      padding: 8px 12px;
      border: 1px solid #e4e7ec;
      border-radius: 8px;
      background: #f9fafb;
      font-size: 14px;
      line-height: 1.4;
      white-space: pre-line;
    }
    .review-opt.is-right {
      background: var(--ok-bg);
      border-color: var(--ok-border);
      color: var(--ok-text);
      font-weight: 600;
    }
    .review-opt.is-wrong-chosen {
      background: var(--bad-bg);
      border-color: var(--bad-border);
      color: var(--bad-text);
      font-weight: 600;
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 5px;
      margin-left: 6px;
      vertical-align: middle;
    }
    .badge-right {
      background: #12b76a;
      color: #fff;
    }
    .badge-user {
      background: #f04438;
      color: #fff;
    }
    .badge-user-ok {
      background: #027a48;
      color: #fff;
    }
    .review-opt img {
      display: block;
      max-width: 240px;
      max-height: 160px;
      margin-top: 6px;
      border-radius: 6px;
    }
    .bottom-actions {
      display: flex;
      justify-content: center;
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid #e4e7ec;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <!-- Экран 1: Выбор дисциплины -->
    <section id="startScreen" class="card">
      <h1>Онлайн-тестирование</h1>
      <p class="sub">Выберите дисциплину — система случайным образом подберёт 20 вопросов и перемешает варианты ответов.</p>
      <div id="subjectGrid" class="subject-grid">Загрузка базы вопросов...</div>
    </section>

    <!-- Экран 2: Прохождение теста -->
    <section id="quizScreen" class="card hidden">
      <div class="top-bar">
        <strong id="quizSubjectTitle">Дисциплина</strong>
        <span id="questionCounter">Вопрос 1 из 20</span>
        <button class="btn" id="quitBtn" style="padding:6px 12px;font-size:13px;">Сменить дисциплину</button>
      </div>
      <div class="progress-wrap"><div id="progressFill" class="progress-fill"></div></div>

      <div id="qMeta" class="q-meta"></div>
      <div id="qText" class="q-text"></div>
      <div id="qImages" class="q-images"></div>
      <div id="optionsContainer" class="options"></div>

      <div class="nav-btns">
        <button class="btn" id="prevBtn">← Назад</button>
        <button class="btn btn-primary" id="nextBtn">Далее →</button>
      </div>
    </section>

    <!-- Экран 3: Итоговый результат -->
    <section id="resultScreen" class="card hidden">
      <div class="result-box">
        <h2 id="resSubject">Результат теста</h2>
        <div class="score-big" id="finalGrade">Отметка: 1</div>
        <div class="score-sub" id="correctOutOf">Правильных ответов: 0 из 20</div>
        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
          <button class="btn btn-primary" id="retrySameBtn">Пройти ещё 20 вопросов по этой дисциплине</button>
          <button class="btn" id="backToMenuBtn">Выбрать другую дисциплину</button>
        </div>
      </div>
      <div id="reviewContainer"></div>
      <div class="bottom-actions">
        <button class="btn btn-primary" id="scrollTopBtn">Вверх ↑</button>
      </div>
    </section>
  </div>

  <script>
    const QUESTIONS_PER_TEST = 20;

    // Критерии оценки (Приложение 6 — уровень среднего специального образования)
    const SCORE_TABLE = {
      0: 1,
      1: 1, 2: 1, 3: 1, 4: 1, 5: 1, 6: 1,
      7: 2, 8: 2, 9: 2, 10: 2, 11: 2,
      12: 3, 13: 3,
      14: 4,
      15: 5,
      16: 6,
      17: 7,
      18: 8,
      19: 9,
      20: 10
    };

    function calcFinalScore(correctCount, totalCount) {
      if (totalCount === 20 && Object.prototype.hasOwnProperty.call(SCORE_TABLE, correctCount)) {
        return SCORE_TABLE[correctCount];
      }
      const scaled = Math.round((correctCount / totalCount) * 20);
      return SCORE_TABLE[scaled] ?? 1;
    }

    let allQuestions = [];
    let currentSubject = "";
    let quizQuestions = [];
    let userAnswers = [];
    let currentIndex = 0;

    const startScreen = document.getElementById("startScreen");
    const quizScreen = document.getElementById("quizScreen");
    const resultScreen = document.getElementById("resultScreen");
    const subjectGrid = document.getElementById("subjectGrid");

    async function init() {
      try {
        // Параметр ?v= предотвращает загрузку устаревшего JSON из кэша браузера
        const res = await fetch("questions.json?v=" + Date.now(), { cache: "no-store" });
        allQuestions = await res.json();

        const bySubject = {};
        for (const q of allQuestions) {
          bySubject[q.subject] = (bySubject[q.subject] || 0) + 1;
        }

        subjectGrid.innerHTML = "";
        Object.keys(bySubject).forEach(subj => {
          const btn = document.createElement("button");
          btn.className = "subj-btn";
          btn.innerHTML = `
            <div class="subj-title">${escapeHtml(subj)}</div>
            <div class="subj-count">В базе: ${bySubject[subj]} вопр.</div>
          `;
          btn.addEventListener("click", () => startQuiz(subj));
          subjectGrid.appendChild(btn);
        });
      } catch (err) {
        subjectGrid.textContent = "Ошибка загрузки questions.json.";
        console.error(err);
      }
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    // Перемешивание Фишера — Йетса (гарантирует новый случайный порядок)
    function shuffleArray(arr) {
      const copy = arr.map(item => ({ ...item }));
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const temp = copy[i];
        copy[i] = copy[j];
        copy[j] = temp;
      }
      return copy;
    }

    function startQuiz(subject) {
      currentSubject = subject;
      const pool = allQuestions.filter(q => q.subject === subject);

      // Перемешиваем вопросы и принудительно перемешиваем варианты ответа внутри каждого вопроса
      const picked = shuffleArray(pool).slice(0, Math.min(QUESTIONS_PER_TEST, pool.length));
      quizQuestions = picked.map(q => {
        let mixedOptions = shuffleArray(q.options || []);
        // Если случайно выпал точно такой же порядок, как в исходнике — перемешиваем ещё раз
        if (
          mixedOptions.length > 1 &&
          mixedOptions.every((opt, i) => opt.text === q.options[i].text)
        ) {
          mixedOptions = shuffleArray(mixedOptions);
        }
        return {
          ...q,
          options: mixedOptions
        };
      });

      userAnswers = new Array(quizQuestions.length).fill(null);
      currentIndex = 0;

      startScreen.classList.add("hidden");
      resultScreen.classList.add("hidden");
      quizScreen.classList.remove("hidden");

      document.getElementById("quizSubjectTitle").textContent = `Дисциплина: ${subject}`;
      renderQuestion();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderQuestion() {
      const q = quizQuestions[currentIndex];
      const total = quizQuestions.length;

      document.getElementById("questionCounter").textContent = `Вопрос ${currentIndex + 1} из ${total}`;
      document.getElementById("progressFill").style.width = `${((currentIndex + 1) / total) * 100}%`;
      document.getElementById("qMeta").textContent = `Источник: Вариант ${q.variant}, №${q.number} • Варианты перемешаны`;
      document.getElementById("qText").textContent = q.question;

      const qImagesEl = document.getElementById("qImages");
      qImagesEl.innerHTML = (q.images || [])
        .map(src => `<img src="${src}" alt="Иллюстрация к вопросу" />`)
        .join("");

      const optsEl = document.getElementById("optionsContainer");
      optsEl.innerHTML = "";

      q.options.forEach((opt, idx) => {
        const isSelected = userAnswers[currentIndex] === idx;
        const label = document.createElement("label");
        label.className = "opt-label" + (isSelected ? " selected" : "");

        const imgsHtml = (opt.images || [])
          .map(src => `<img src="${src}" alt="Вариант ответа" />`)
          .join("");

        label.innerHTML = `
          <input type="radio" name="opt" value="${idx}" ${isSelected ? "checked" : ""} />
          <div>
            <strong>${idx + 1})</strong> ${escapeHtml(opt.text)}
            ${imgsHtml}
          </div>
        `;

        label.addEventListener("click", () => {
          userAnswers[currentIndex] = idx;
          renderQuestion();
        });

        optsEl.appendChild(label);
      });

      document.getElementById("prevBtn").disabled = currentIndex === 0;
      const nextBtn = document.getElementById("nextBtn");
      nextBtn.textContent = currentIndex === total - 1 ? "Завершить тест" : "Далее →";
    }

    document.getElementById("prevBtn").addEventListener("click", () => {
      if (currentIndex > 0) {
        currentIndex--;
        renderQuestion();
      }
    });

    document.getElementById("nextBtn").addEventListener("click", () => {
      if (currentIndex < quizQuestions.length - 1) {
        currentIndex++;
        renderQuestion();
      } else {
        finishQuiz();
      }
    });

    document.getElementById("quitBtn").addEventListener("click", () => {
      quizScreen.classList.add("hidden");
      startScreen.classList.remove("hidden");
    });

    document.getElementById("backToMenuBtn").addEventListener("click", () => {
      resultScreen.classList.add("hidden");
      startScreen.classList.remove("hidden");
    });

    document.getElementById("retrySameBtn").addEventListener("click", () => {
      startQuiz(currentSubject);
    });

    document.getElementById("scrollTopBtn").addEventListener("click", () => {
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    function finishQuiz() {
      quizScreen.classList.add("hidden");
      resultScreen.classList.remove("hidden");

      const total = quizQuestions.length;
      let correctCount = 0;

      quizQuestions.forEach((q, idx) => {
        const chosenIdx = userAnswers[idx];
        if (chosenIdx !== null && q.options[chosenIdx] && q.options[chosenIdx].is_correct) {
          correctCount++;
        }
      });

      const finalScore = calcFinalScore(correctCount, total);

      document.getElementById("resSubject").textContent = `Результат: ${currentSubject}`;
      document.getElementById("finalGrade").textContent = `Отметка: ${finalScore}`;
      document.getElementById("correctOutOf").textContent = `Правильных ответов: ${correctCount} из ${total}`;

      const reviewEl = document.getElementById("reviewContainer");
      reviewEl.innerHTML = quizQuestions.map((q, idx) => {
        const chosenIdx = userAnswers[idx];
        const qImgsHtml = (q.images || []).length
          ? `<div class="q-images">${q.images.map(src => `<img src="${src}" alt="Иллюстрация" />`).join("")}</div>`
          : "";

        const allOptsHtml = q.options.map((opt, optIdx) => {
          const isChosen = chosenIdx === optIdx;
          const isRight = Boolean(opt.is_correct);

          let cls = "review-opt";
          let badges = "";

          if (isRight && isChosen) {
            cls += " is-right";
            badges = `<span class="badge badge-user-ok">Ваш ответ • Правильно</span>`;
          } else if (isRight) {
            cls += " is-right";
            badges = `<span class="badge badge-right">Правильный ответ</span>`;
          } else if (isChosen) {
            cls += " is-wrong-chosen";
            badges = `<span class="badge badge-user">Ваш ответ</span>`;
          }

          const optImgs = (opt.images || [])
            .map(src => `<img src="${src}" alt="Вариант" />`)
            .join("");

          return `
            <div class="${cls}">
              <strong>${optIdx + 1})</strong> ${escapeHtml(opt.text)}${badges}
              ${optImgs}
            </div>
          `;
        }).join("");

        const notAnsweredNote = chosenIdx === null
          ? `<div class="ans-bad" style="margin-bottom:8px;">Ответ не был выбран</div>`
          : "";

        return `
          <div class="review-item">
            <div class="q-meta">Вопрос ${idx + 1} (Вариант ${q.variant}, №${q.number})</div>
            <div class="q-text" style="font-size:15px;margin-bottom:8px;">${escapeHtml(q.question)}</div>
            ${qImgsHtml}
            ${notAnsweredNote}
            <div class="review-opts">${allOptsHtml}</div>
          </div>
        `;
      }).join("");

      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    init();
  </script>
</body>
</html>
