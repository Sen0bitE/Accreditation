<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>База тестов — Аккредитация</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #1e2430;
      --muted: #667085;
      --border: #e4e7ec;
      --accent: #2563eb;
      --ok-bg: #ecfdf3;
      --ok-border: #12b76a;
      --ok-text: #027a48;
      --bad-bg: #fef3f2;
      --bad-border: #f04438;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .container {
      max-width: 960px;
      margin: 0 auto;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 20px;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    input[type="search"], select, button {
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      background: #fff;
      color: var(--text);
    }
    input[type="search"] {
      flex: 1 1 260px;
    }
    button {
      cursor: pointer;
      font-weight: 500;
    }
    button.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .stats {
      margin-top: 8px;
      font-size: 13px;
      color: var(--muted);
    }
    main {
      padding: 20px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px;
      margin-bottom: 14px;
      box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
    }
    .meta {
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .q-text {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.45;
      margin-bottom: 12px;
    }
    .q-images {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
    }
    .q-images img {
      max-width: 100%;
      max-height: 320px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #fff;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .opt {
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.4;
      cursor: pointer;
      transition: 0.15s ease;
    }
    .opt:hover {
      border-color: #cbd5e1;
      background: #f8fafc;
    }
    .show-keys .opt.correct,
    .opt.revealed-ok {
      background: var(--ok-bg);
      border-color: var(--ok-border);
      color: var(--ok-text);
      font-weight: 600;
    }
    .opt.revealed-bad {
      background: var(--bad-bg);
      border-color: var(--bad-border);
    }
    .opt img {
      display: block;
      max-width: 260px;
      max-height: 180px;
      margin-top: 6px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <h1>База вопросов и ключей</h1>
      <div class="controls">
        <input type="search" id="searchInput" placeholder="Поиск по тексту вопроса или ответа..." />
        <select id="subjectFilter">
          <option value="ALL">Все дисциплины</option>
        </select>
        <select id="variantFilter">
          <option value="ALL">Все варианты</option>
        </select>
        <button id="toggleKeysBtn" class="active">Ключи: показаны</button>
      </div>
      <div class="stats" id="statsBar">Загрузка вопросов...</div>
    </div>
  </header>

  <main class="container show-keys" id="cardsContainer"></main>

  <script>
    let allQuestions = [];
    let showKeys = true;

    const searchInput = document.getElementById("searchInput");
    const subjectFilter = document.getElementById("subjectFilter");
    const variantFilter = document.getElementById("variantFilter");
    const toggleKeysBtn = document.getElementById("toggleKeysBtn");
    const cardsContainer = document.getElementById("cardsContainer");
    const statsBar = document.getElementById("statsBar");

    async function init() {
      try {
        const res = await fetch("questions.json");
        allQuestions = await res.json();

        const subjects = [...new Set(allQuestions.map(q => q.subject))];
        subjects.forEach(s => {
          const opt = document.createElement("option");
          opt.value = s;
          opt.textContent = s;
          subjectFilter.appendChild(opt);
        });

        const variants = [...new Set(allQuestions.map(q => q.variant))].sort((a, b) => a - b);
        variants.forEach(v => {
          const opt = document.createElement("option");
          opt.value = String(v);
          opt.textContent = `Вариант ${v}`;
          variantFilter.appendChild(opt);
        });

        render();
      } catch (err) {
        statsBar.textContent = "Ошибка загрузки questions.json. Откройте через локальный сервер или GitHub Pages.";
        console.error(err);
      }
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function render() {
      const qText = searchInput.value.trim().toLowerCase();
      const subj = subjectFilter.value;
      const vari = variantFilter.value;

      const filtered = allQuestions.filter(item => {
        if (subj !== "ALL" && item.subject !== subj) return false;
        if (vari !== "ALL" && String(item.variant) !== vari) return false;
        if (qText) {
          const inQ = item.question.toLowerCase().includes(qText);
          const inOpts = item.options.some(o => o.text.toLowerCase().includes(qText));
          if (!inQ && !inOpts) return false;
        }
        return true;
      });

      statsBar.textContent = `Показано: ${filtered.length} из ${allQuestions.length} вопросов`;

      cardsContainer.innerHTML = filtered.map(item => {
        const qImgsHtml = (item.images || []).length
          ? `<div class="q-images">${item.images.map(src => `<img src="${src}" loading="lazy" alt="Иллюстрация" />`).join("")}</div>`
          : "";

        const optsHtml = item.options.map(opt => {
          const optImgs = (opt.images || []).map(src => `<img src="${src}" loading="lazy" alt="Вариант" />`).join("");
          return `
            <div class="opt ${opt.is_correct ? "correct" : ""}" data-correct="${opt.is_correct ? "1" : "0"}">
              <strong>${escapeHtml(opt.key)})</strong> ${escapeHtml(opt.text)}
              ${optImgs}
            </div>
          `;
        }).join("");

        return `
          <article class="card">
            <div class="meta">${escapeHtml(item.subject)} • Вариант ${item.variant} • Вопрос №${item.number}</div>
            <div class="q-text">${escapeHtml(item.question)}</div>
            ${qImgsHtml}
            <div class="options">${optsHtml}</div>
          </article>
        `;
      }).join("");
    }

    cardsContainer.addEventListener("click", (e) => {
      const optEl = e.target.closest(".opt");
      if (!optEl || showKeys) return;
      const isOk = optEl.dataset.correct === "1";
      optEl.classList.add(isOk ? "revealed-ok" : "revealed-bad");
      if (!isOk) {
        const parent = optEl.closest(".options");
        const rightOpt = parent.querySelector('.opt[data-correct="1"]');
        if (rightOpt) rightOpt.classList.add("revealed-ok");
      }
    });

    toggleKeysBtn.addEventListener("click", () => {
      showKeys = !showKeys;
      cardsContainer.classList.toggle("show-keys", showKeys);
      toggleKeysBtn.classList.toggle("active", showKeys);
      toggleKeysBtn.textContent = showKeys ? "Ключи: показаны" : "Режим проверки (клик по ответу)";
      document.querySelectorAll(".revealed-ok, .revealed-bad").forEach(el => {
        el.classList.remove("revealed-ok", "revealed-bad");
      });
    });

    searchInput.addEventListener("input", render);
    subjectFilter.addEventListener("change", render);
    variantFilter.addEventListener("change", render);

    init();
  </script>
</body>
</html>
