<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Подготовка к тестированию</title>
  <style>
    :root {
      --bg: #f3f5f9;
      --surface: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --border: #e5e7eb;
      --success-bg: #ecfdf5;
      --success-border: #10b981;
      --success-text: #065f46;
      --error-bg: #fef2f2;
      --error-border: #ef4444;
      --error-text: #991b1b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: clamp(12px, 3vw, 32px);
      line-height: 1.5;
    }

    .container {
      width: 100%;
      max-width: 920px;
      background: var(--surface);
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
      padding: clamp(18px, 4vw, 36px);
    }

    .hidden {
      display: none !important;
    }

    /* Стартовый экран */
    .start-screen {
      text-align: center;
      padding: clamp(32px, 8vw, 72px) 16px;
    }

    .start-screen h1 {
      font-size: clamp(1.5rem, 3.5vw, 2.25rem);
      margin-bottom: 28px;
      font-weight: 700;
    }

    /* Кнопки */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 14px 28px;
      font-size: clamp(1rem, 2vw, 1.1rem);
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
    }

    .btn:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    .btn:active:not(:disabled) {
      transform: scale(0.99);
    }

    .btn:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .btn-outline {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-outline:hover:not(:disabled) {
      background: #f9fafb;
    }

    /* Выбор предмета */
    .subject-screen h2 {
      font-size: clamp(1.25rem, 2.8vw, 1.65rem);
      margin-bottom: 20px;
    }

    .subject-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }

    .subject-card {
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      cursor: pointer;
      font-size: clamp(1rem, 2vw, 1.1rem);
      font-weight: 500;
      transition: all 0.15s ease;
      background: #fff;
    }

    .subject-card:hover {
      border-color: #93c5fd;
      background: #f8fafc;
    }

    .subject-card.selected {
      border-color: var(--primary);
      background: #eff6ff;
      color: var(--primary-hover);
      font-weight: 600;
    }

    /* Экран тестирования */
    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      padding-bottom: 16px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    .quiz-subject {
      font-weight: 600;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .quiz-counter {
      font-weight: 700;
      font-size: 1rem;
      background: #eff6ff;
      color: var(--primary);
      padding: 6px 14px;
      border-radius: 999px;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: var(--border);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .progress-fill {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.25s ease;
    }

    .question-box {
      margin-bottom: 24px;
    }

    .question-text {
      font-size: clamp(1.05rem, 2.2vw, 1.2rem);
      font-weight: 600;
      white-space: pre-wrap;
      word-break: break-word;
      margin-bottom: 14px;
    }

    .question-images, .option-images {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 12px 0;
    }

    .question-images img, .option-images img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      border: 1px solid var(--border);
      align-self: flex-start;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 28px;
    }

    .option-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .option-item:hover {
      border-color: #93c5fd;
      background: #f8fafc;
    }

    .option-item.selected {
      border-color: var(--primary);
      background: #eff6ff;
    }

    .option-radio {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid #9ca3af;
      flex-shrink: 0;
      margin-top: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .option-item.selected .option-radio {
      border-color: var(--primary);
    }

    .option-item.selected .option-radio::after {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--primary);
    }

    .option-content {
      flex: 1;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: clamp(0.95rem, 2vw, 1.05rem);
    }

    .quiz-footer {
      display: flex;
      justify-content: flex-end;
    }

    /* Результаты */
    .result-summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
    }

    .stat-label {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: clamp(1.75rem, 4vw, 2.4rem);
      font-weight: 800;
      color: var(--primary);
    }

    .review-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .review-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 28px;
    }

    .review-card {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
    }

    .review-q-header {
      font-weight: 700;
      margin-bottom: 12px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .review-options {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
    }

    .review-option {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .review-option.correct {
      background: var(--success-bg);
      border-color: var(--success-border);
      color: var(--success-text);
    }

    .review-option.wrong {
      background: var(--error-bg);
      border-color: var(--error-border);
      color: var(--error-text);
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }

    .badge {
      font-size: 0.78rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 6px;
    }

    .badge-user {
      background: #dbeafe;
      color: #1e40af;
    }

    .badge-wrong {
      background: #fee2e2;
      color: #991b1b;
    }

    .badge-correct {
      background: #d1fae5;
      color: #065f46;
    }

    .result-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .error-banner {
      background: #fef2f2;
      border: 1px solid #ef4444;
      color: #991b1b;
      padding: 16px;
      border-radius: 10px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="dbError" class="error-banner hidden">
      База вопросов (<code>questions_db.js</code>) не найдена. Поместите 4 файла <code>.docx</code> в одну папку с <code>parser.py</code> и запустите скрипт.
    </div>

    <!-- Экран 1: Старт -->
    <div id="screenStart" class="start-screen">
      <h1>Подготовка к тестированию</h1>
      <button id="btnStartPrep" class="btn">Начать подготовку</button>
    </div>

    <!-- Экран 2: Выбор предмета -->
    <div id="screenSubject" class="subject-screen hidden">
      <h2>Выберите предмет</h2>
      <div id="subjectList" class="subject-list"></div>
      <button id="btnStartQuiz" class="btn" disabled>Начать тест</button>
    </div>

    <!-- Экран 3: Прохождение теста -->
    <div id="screenQuiz" class="hidden">
      <div class="quiz-header">
        <div id="quizSubjectTitle" class="quiz-subject"></div>
        <div id="quizCounter" class="quiz-counter">Вопрос 1 из 20</div>
      </div>
      <div class="progress-bar">
        <div id="progressFill" class="progress-fill"></div>
      </div>
      <div class="question-box">
        <div id="questionText" class="question-text"></div>
        <div id="questionImages" class="question-images"></div>
      </div>
      <div id="optionsList" class="options-list"></div>
      <div class="quiz-footer">
        <button id="btnNextQuestion" class="btn" disabled>Ответить</button>
      </div>
    </div>

    <!-- Экран 4: Результаты -->
    <div id="screenResult" class="hidden">
      <div class="result-summary">
        <div class="stat-card">
          <div class="stat-label">Правильных ответов</div>
          <div id="statScore" class="stat-value">0 / 20</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Отметка (балл)</div>
          <div id="statGrade" class="stat-value">1</div>
        </div>
      </div>

      <div class="review-title">Результаты по вопросам</div>
      <div id="reviewList" class="review-list"></div>

      <div class="result-actions">
        <button id="btnRetry" class="btn">Пройти заново</button>
        <button id="btnChangeSubject" class="btn btn-outline">Выбрать другой предмет</button>
      </div>
    </div>
  </div>

  <script src="questions_db.js"></script>
  <script>
    const state = {
      selectedSubject: null,
      quizQuestions: [],
      currentIndex: 0,
      selectedOptionIndex: null,
      userAnswers: []
    };

    const screenStart = document.getElementById("screenStart");
    const screenSubject = document.getElementById("screenSubject");
    const screenQuiz = document.getElementById("screenQuiz");
    const screenResult = document.getElementById("screenResult");
    const dbError = document.getElementById("dbError");

    function showScreen(screen) {
      [screenStart, screenSubject, screenQuiz, screenResult].forEach(s => s.classList.add("hidden"));
      screen.classList.remove("hidden");
    }

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function calculateGrade(correctCount) {
      if (correctCount <= 6) return 1;
      if (correctCount <= 11) return 2;
      if (correctCount <= 13) return 3;
      if (correctCount === 14) return 4;
      if (correctCount === 15) return 5;
      if (correctCount === 16) return 6;
      if (correctCount === 17) return 7;
      if (correctCount === 18) return 8;
      if (correctCount === 19) return 9;
      return 10;
    }

    function renderImages(container, images) {
      container.innerHTML = "";
      if (!images || !images.length) return;
      images.forEach(src => {
        const img = document.createElement("img");
        img.src = src;
        img.alt = "Иллюстрация к заданию";
        container.appendChild(img);
      });
    }

    function initSubjects() {
      if (!window.QUESTIONS_DB) {
        dbError.classList.remove("hidden");
        return;
      }
      const list = document.getElementById("subjectList");
      list.innerHTML = "";
      const subjects = Object.keys(window.QUESTIONS_DB);

      subjects.forEach(subj => {
        const card = document.createElement("div");
        card.className = "subject-card";
        card.textContent = subj;
        card.onclick = () => {
          document.querySelectorAll(".subject-card").forEach(c => c.classList.remove("selected"));
          card.classList.add("selected");
          state.selectedSubject = subj;
          document.getElementById("btnStartQuiz").disabled = false;
        };
        list.appendChild(card);
      });
    }

    function startQuiz() {
      const pool = window.QUESTIONS_DB[state.selectedSubject] || [];
      const picked = shuffleArray(pool).slice(0, 20);

      state.quizQuestions = picked.map(q => {
        const indexedOptions = q.options.map((opt, idx) => ({
          ...opt,
          isCorrect: idx === q.correct
        }));
        const shuffledOptions = shuffleArray(indexedOptions);
        const correctIdx = shuffledOptions.findIndex(o => o.isCorrect);
        return {
          text: q.text,
          images: q.images || [],
          options: shuffledOptions,
          correctIndex: correctIdx
        };
      });

      state.currentIndex = 0;
      state.userAnswers = [];
      showScreen(screenQuiz);
      renderQuestion();
    }

    function renderQuestion() {
      const total = state.quizQuestions.length;
      const q = state.quizQuestions[state.currentIndex];
      state.selectedOptionIndex = null;

      document.getElementById("quizSubjectTitle").textContent = state.selectedSubject;
      document.getElementById("quizCounter").textContent = `Вопрос ${state.currentIndex + 1} из ${total}`;
      document.getElementById("progressFill").style.width = `${(state.currentIndex / total) * 100}%`;

      document.getElementById("questionText").textContent = q.text;
      renderImages(document.getElementById("questionImages"), q.images);

      const optionsList = document.getElementById("optionsList");
      optionsList.innerHTML = "";

      q.options.forEach((opt, idx) => {
        const item = document.createElement("div");
        item.className = "option-item";

        const radio = document.createElement("div");
        radio.className = "option-radio";

        const content = document.createElement("div");
        content.className = "option-content";
        content.textContent = opt.text;

        if (opt.images && opt.images.length) {
          const optImgs = document.createElement("div");
          optImgs.className = "option-images";
          renderImages(optImgs, opt.images);
          content.appendChild(optImgs);
        }

        item.appendChild(radio);
        item.appendChild(content);

        item.onclick = () => {
          document.querySelectorAll(".option-item").forEach(el => el.classList.remove("selected"));
          item.classList.add("selected");
          state.selectedOptionIndex = idx;
          document.getElementById("btnNextQuestion").disabled = false;
        };

        optionsList.appendChild(item);
      });

      const btnNext = document.getElementById("btnNextQuestion");
      btnNext.disabled = true;
      btnNext.textContent = state.currentIndex === total - 1 ? "Завершить тест" : "Следующий вопрос";
    }

    function handleNextQuestion() {
      if (state.selectedOptionIndex === null) return;
      state.userAnswers.push(state.selectedOptionIndex);

      if (state.currentIndex < state.quizQuestions.length - 1) {
        state.currentIndex++;
        renderQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      showScreen(screenResult);
      const total = state.quizQuestions.length;
      let correctCount = 0;

      state.quizQuestions.forEach((q, idx) => {
        if (state.userAnswers[idx] === q.correctIndex) {
          correctCount++;
        }
      });

      document.getElementById("statScore").textContent = `${correctCount} / ${total}`;
      document.getElementById("statGrade").textContent = calculateGrade(correctCount);

      const reviewList = document.getElementById("reviewList");
      reviewList.innerHTML = "";

      state.quizQuestions.forEach((q, qIdx) => {
        const userChoice = state.userAnswers[qIdx];
        const isQuestionCorrect = userChoice === q.correctIndex;

        const card = document.createElement("div");
        card.className = "review-card";

        const header = document.createElement("div");
        header.className = "review-q-header";
        header.textContent = `${qIdx + 1}. ${q.text}`;
        card.appendChild(header);

        if (q.images && q.images.length) {
          const qImgs = document.createElement("div");
          qImgs.className = "question-images";
          renderImages(qImgs, q.images);
          card.appendChild(qImgs);
        }

        const optsWrap = document.createElement("div");
        optsWrap.className = "review-options";

        q.options.forEach((opt, oIdx) => {
          const optDiv = document.createElement("div");
          optDiv.className = "review-option";

          const isUser = oIdx === userChoice;
          const isRight = oIdx === q.correctIndex;

          if (isRight) {
            optDiv.classList.add("correct");
          } else if (isUser && !isQuestionCorrect) {
            optDiv.classList.add("wrong");
          }

          const textSpan = document.createElement("div");
          textSpan.textContent = opt.text;
          optDiv.appendChild(textSpan);

          if (opt.images && opt.images.length) {
            const oImgs = document.createElement("div");
            oImgs.className = "option-images";
            renderImages(oImgs, opt.images);
            optDiv.appendChild(oImgs);
          }

          const badges = document.createElement("div");
          badges.className = "badges";

          if (isUser && isRight) {
            const b = document.createElement("span");
            b.className = "badge badge-correct";
            b.textContent = "Ваш выбор (Верно)";
            badges.appendChild(b);
          } else {
            if (isUser) {
              const bUser = document.createElement("span");
              bUser.className = "badge badge-wrong";
              bUser.textContent = "Ваш выбор";
              badges.appendChild(bUser);
            }
            if (isRight) {
              const bRight = document.createElement("span");
              bRight.className = "badge badge-correct";
              bRight.textContent = "Правильный ответ";
              badges.appendChild(bRight);
            }
          }

          if (badges.children.length) {
            optDiv.appendChild(badges);
          }

          optsWrap.appendChild(optDiv);
        });

        card.appendChild(optsWrap);
        reviewList.appendChild(card);
      });
    }

    document.getElementById("btnStartPrep").onclick = () => {
      initSubjects();
      showScreen(screenSubject);
    };

    document.getElementById("btnStartQuiz").onclick = startQuiz;
    document.getElementById("btnNextQuestion").onclick = handleNextQuestion;
    document.getElementById("btnRetry").onclick = startQuiz;
    document.getElementById("btnChangeSubject").onclick = () => showScreen(screenSubject);
  </script>
</body>
</html>
